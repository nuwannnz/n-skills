# Publishes to npm when a GitHub release is published. Before the first release:
# pick the final package name, remove "private": true from package.json, and add
# an NPM_TOKEN secret to the repository.
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Releases tagged desktop-v* belong to publish-desktop.yml.
    if: ${{ !startsWith(github.event.release.tag_name, 'desktop-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run check
      # Publishes the scrumo CLI (the repository root). The desktop app (desktop/) is published separately.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
