# Publishes the desktop app (desktop/) to npm when a GitHub release tagged
# desktop-vX.Y.Z is published. The tag must match desktop/package.json's version.
# Uses the same NPM_TOKEN secret as the CLI's publish workflow.
name: Publish desktop

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ startsWith(github.event.release.tag_name, 'desktop-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run check:desktop
      - name: The tag matches the package version
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          if [ "desktop-v$version" != "${{ github.event.release.tag_name }}" ]; then
            echo "Tag ${{ github.event.release.tag_name }} does not match desktop/package.json version $version" >&2
            exit 1
          fi
      - run: npm publish -w desktop --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
