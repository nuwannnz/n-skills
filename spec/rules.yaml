# Every rule the validator reports. Codes are stable: never reuse or renumber.
# severity: error fails validation; warning is reported but exits 0.
# fixable: true means `scrumo validate --fix` corrects it without judgment.
rules:
  # Layout
  - code: SCRUMO101
    severity: error
    fixable: false
    summary: File or folder under the docs folder that the layout doesn't allow.
  - code: SCRUMO102
    severity: error
    fixable: false
    summary: File name doesn't match the pattern for its folder.
  - code: SCRUMO103
    severity: error
    fixable: false
    summary: Ticket ID in the file name differs from the frontmatter id.
  - code: SCRUMO104
    severity: error
    fixable: false
    summary: scrumo.yaml is missing or invalid.
  - code: SCRUMO105
    severity: error
    fixable: false
    summary: Ticket ID uses a key other than the project key.

  - code: SCRUMO106
    severity: warning
    fixable: false
    summary: The scrumo version recorded in scrumo.yaml differs from the scrumo that is running, so the installed skills may be out of date (run scrumo update).

  # Markdown format
  - code: SCRUMO201
    severity: error
    fixable: partial
    summary: Markdown style violation (the message names the markdownlint rule). Fixed when markdownlint can fix it.
  - code: SCRUMO202
    severity: error
    fixable: false
    summary: Document must have exactly one H1, directly after the frontmatter.
  - code: SCRUMO203
    severity: error
    fixable: true
    summary: H1 text differs from the frontmatter title.
  - code: SCRUMO204
    severity: error
    fixable: true
    summary: File uses CRLF line endings or a byte order mark.
  - code: SCRUMO205
    severity: error
    fixable: false
    summary: Heading level not allowed here (H3 only inside sections that define subsections or entries; H4 and deeper never).

  # Frontmatter
  - code: SCRUMO301
    severity: error
    fixable: false
    summary: Frontmatter block missing or not valid YAML.
  - code: SCRUMO302
    severity: error
    fixable: false
    summary: Required frontmatter field missing.
  - code: SCRUMO303
    severity: error
    fixable: false
    summary: Unknown frontmatter field.
  - code: SCRUMO304
    severity: error
    fixable: false
    summary: Frontmatter value has the wrong type, or is null where null isn't allowed.
  - code: SCRUMO305
    severity: error
    fixable: false
    summary: Frontmatter value isn't one of the allowed values, or is outside its bounds.
  - code: SCRUMO306
    severity: error
    fixable: false
    summary: Frontmatter value doesn't match its format (date, semver, ticket ID, or pattern).
  - code: SCRUMO307
    severity: error
    fixable: true
    summary: Frontmatter keys are out of order.

  # Sections
  - code: SCRUMO401
    severity: error
    fixable: true
    summary: Required section missing (--fix inserts it empty, with its guidance as a comment).
  - code: SCRUMO402
    severity: error
    fixable: false
    summary: Section out of order.
  - code: SCRUMO403
    severity: error
    fixable: false
    summary: Unknown section heading.
  - code: SCRUMO404
    severity: error
    fixable: false
    summary: Section appears more than once.
  - code: SCRUMO405
    severity: error
    fixable: false
    summary: Section content isn't the required type (table, list, checklist, fields, entries, or generated block).
  - code: SCRUMO406
    severity: error
    fixable: false
    summary: Table columns differ from the schema, or a cell breaks a column rule.
  - code: SCRUMO407
    severity: error
    fixable: false
    summary: Row, entry, or item ID is malformed or duplicated.
  - code: SCRUMO408
    severity: error
    fixable: false
    summary: List, checklist, or entry item doesn't match the required pattern or labels.
  - code: SCRUMO409
    severity: error
    fixable: false
    summary: Section is empty but must have content in the current status, or has fewer items than the minimum.
  - code: SCRUMO410
    severity: error
    fixable: false
    summary: Section must be empty in the current status (for example Open Questions in an approved PRD).
  - code: SCRUMO411
    severity: error
    fixable: false
    summary: Placeholder text (TODO, TBD, ???, <...>) in a status that forbids it.
  - code: SCRUMO412
    severity: error
    fixable: false
    summary: Changelog's newest version differs from the frontmatter version.

  # References
  - code: SCRUMO501
    severity: error
    fixable: false
    summary: Two tickets share an ID.
  - code: SCRUMO502
    severity: error
    fixable: false
    summary: Ticket reference points to a ticket that doesn't exist or is the wrong kind.
  - code: SCRUMO503
    severity: error
    fixable: false
    summary: Requirement ID not defined in the PRD.
  - code: SCRUMO504
    severity: warning
    fixable: false
    summary: PRD functional requirement not covered by any epic.
  - code: SCRUMO505
    severity: error
    fixable: false
    summary: Story's sprint isn't in the sprint tracker.
  - code: SCRUMO506
    severity: error
    fixable: false
    summary: Story dependencies form a cycle.
  - code: SCRUMO507
    severity: error
    fixable: false
    summary: AC ID cited in Tasks, Test Plan, or QA Record isn't defined in the story.
  - code: SCRUMO508
    severity: error
    fixable: false
    summary: NFR Mapping cites an unknown NFR, or an approved architecture leaves an NFR unmapped.
  - code: SCRUMO509
    severity: error
    fixable: false
    summary: Epic's Requirements Coverage rows differ from its frontmatter requirements.
  - code: SCRUMO510
    severity: error
    fixable: false
    summary: Sprint numbers aren't 1, 2, 3, ... in order, or a sprint section and its frontmatter entry don't match up.

  # Status gates
  - code: SCRUMO601
    severity: error
    fixable: false
    summary: Status needs an upstream document approved (epic ready needs the PRD; story ready needs the architecture and coding standards).
  - code: SCRUMO602
    severity: error
    fixable: false
    summary: Story can't be ready or later without points, or with an AC that no task cites.
  - code: SCRUMO603
    severity: error
    fixable: false
    summary: Story can't be ready or later while its epic is draft.
  - code: SCRUMO604
    severity: error
    fixable: false
    summary: Story in-progress needs an active sprint and an assignee.
  - code: SCRUMO605
    severity: error
    fixable: false
    summary: Story in-qa or done needs every task checked.
  - code: SCRUMO606
    severity: error
    fixable: false
    summary: Story done needs a PASS in its latest QA round for every AC.
  - code: SCRUMO607
    severity: error
    fixable: true
    summary: blocked_reason must be set while blocked and null otherwise (--fix clears a stale reason).
  - code: SCRUMO608
    severity: error
    fixable: false
    summary: Epic status is inconsistent with its stories (done needs every story done).
  - code: SCRUMO609
    severity: error
    fixable: false
    summary: Sprint state is invalid (more than one active sprint, end before start, missing committed or completed).
  - code: SCRUMO610
    severity: warning
    fixable: false
    summary: Sprint commits more points than its capacity.
  - code: SCRUMO611
    severity: error
    fixable: false
    summary: Story in a planned or active sprint is still draft.
  - code: SCRUMO612
    severity: error
    fixable: false
    summary: Story is committed to a sprint ahead of a story it depends on.

  # Generated content
  - code: SCRUMO701
    severity: error
    fixable: true
    summary: Generated block is stale or was edited by hand.
  - code: SCRUMO702
    severity: error
    fixable: true
    summary: Generated block markers missing or malformed.
