name: scrumo validate

on:
  pull_request:
    paths:
      - '{docs_dir}/**'
      - scrumo.yaml
  push:
    branches: [main]
    paths:
      - '{docs_dir}/**'
      - scrumo.yaml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes -p {package} scrumo validate
